name: m9a_env
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.11
  - pip
  - pip:
    - -r requirements.txt
    # 额外的conda特定依赖可以在这里添加

# M9A项目的Conda环境配置文件
# 使用以下命令创建环境：
# conda env create -f environment.yml
#
# 使用以下命令激活环境：
# conda activate m9a_env
#
# 然后可以直接运行：
# python agent/main.py